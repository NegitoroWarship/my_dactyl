CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Exercise the standard keyboard boot protocol in addition to ZMK's normal
# report protocol. The custom probe wraps only the HID write and completion
# callback; enabling the whole USB driver log over USB CDC is recursive.
CONFIG_ZMK_USB_BOOT=y
CONFIG_USB_NRFX_EVT_QUEUE_SIZE=64
CONFIG_USB_NRFX_WORK_QUEUE_STACK_SIZE=2048

CONFIG_ZMK_BLE=n
CONFIG_SETTINGS=n
