# Emit ZMK's kscan debug messages over the zmk-usb-logging CDC ACM port.
CONFIG_LOG=y
CONFIG_ZMK_LOG_LEVEL_DBG=y

# Poll the two inputs so this test does not depend on GPIO interrupt handling.
CONFIG_ZMK_KSCAN_DIRECT_POLLING=y

# Keep this diagnostic image USB-only and stateless.
CONFIG_ZMK_BLE=n
CONFIG_SETTINGS=n
