include:
  - board: bmp_boost
    shield: sakoa_dactyl_left
  - board: bmp_boost
    shield: sakoa_dactyl_right
  - board: bmp_boost
    shield: settings_reset
  # BMP Boost公式READMEが指定するPro Micro GPIO単体テスター。
  - board: bmp_boost
    shield: tester_pro_micro
  # P0.05/P0.19をポーリングし、USB CDCへkscanデバッグログを出す診断用。
  - board: bmp_boost
    shield: sakoa_gpio_logger
    snippet: zmk-usb-logging
  # GPIOを使わず、Aの押下・解放を自動生成するUSB HID単体診断用。
  - board: bmp_boost
    shield: sakoa_usb_auto_test
    snippet: zmk-usb-logging
